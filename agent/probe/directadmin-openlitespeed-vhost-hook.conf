# BEGIN UNIXSEE RUNTIME PROBE
# Installer-owned DirectAdmin/OpenLiteSpeed customization. This block is
# injected into every generated primary OLS vhost through CUSTOM7.
context /.well-known/unixsee/ {
  location                /opt/unixsee-agent/probe/
  allowBrowse             1
  addDefaultCharset       off

  rewrite {
    enable                0
  }

  accessControl {
    allow                 127.0.0.1
    deny                  ALL
  }

  # The shared probe script lives outside each hosting user's normal
  # open_basedir. Scope the override to this context only and expose only the
  # target site's own document root plus the probe/runtime temp paths.
  phpIniOverride {
    php_admin_value open_basedir "|DOCROOT|:/opt/unixsee-agent/probe/:/tmp:/var/tmp:/dev/urandom"
  }
}
# END UNIXSEE RUNTIME PROBE
