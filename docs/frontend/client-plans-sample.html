<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پیش‌نمایش پلن‌های زیرساخت یونیکسی | مینیمال و ریسپانسیو</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Vazirmatn", "sans-serif"],
            },
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
                900: "#312e81",
                950: "#0f172a",
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Vazirmatn", sans-serif;
        background-color: #080c14;
        color: #f1f5f9;
      }
      .glass-card {
        background: linear-gradient(
          135deg,
          rgba(30, 41, 59, 0.5) 0%,
          rgba(15, 23, 42, 0.7) 100%
        );
        backdrop-filter: blur(12px);
      }
      .glass-popular {
        background: linear-gradient(
          135deg,
          rgba(49, 46, 129, 0.3) 0%,
          rgba(15, 23, 42, 0.8) 100%
        );
        backdrop-filter: blur(16px);
      }
      .glass-panel {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.02) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        backdrop-filter: blur(8px);
      }
      .glow-effect {
        box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.25);
      }
      .tilt-card {
        transition:
          transform 0.1s ease,
          box-shadow 0.3s ease,
          border-color 0.3s ease;
        transform-style: preserve-3d;
      }
      .tilt-card:mouseleave {
        transition:
          transform 0.5s ease-out,
          box-shadow 0.3s ease;
      }
    </style>
  </head>
  <body
    class="min-h-screen antialiased selection:bg-brand-500 selection:text-white py-12 px-4 sm:px-6 lg:px-8"
  >
    <div
      class="fixed inset-0 pointer-events-none overflow-hidden -z-10 flex items-center justify-center"
    >
      <div
        class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-indigo-600/10 blur-[100px] rounded-full"
      ></div>
      <div
        class="absolute bottom-0 right-[-10%] w-[500px] h-[500px] bg-blue-600/5 blur-[100px] rounded-full"
      ></div>
    </div>

    <main class="max-w-7xl mx-auto">
      <div
        id="plans-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-stretch mb-16 relative z-10"
      >
        <!-- Plan cards will be rendered dynamically here -->
      </div>

      <div class="max-w-5xl mx-auto space-y-6">
        <!-- Common Features Component -->
        <div
          class="glass-panel border border-slate-800/60 rounded-3xl p-8 relative overflow-hidden"
        >
          <div class="text-center mb-8">
            <h2
              id="common-features-title"
              class="text-xl font-bold text-white mb-2"
            ></h2>
            <p class="text-slate-400 text-sm">
              تمامی پلن‌های ما برای حفظ بالاترین سطح پایداری به این امکانات مجهز
              شده‌اند.
            </p>
          </div>
          <div
            id="common-features-grid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
          >
            <!-- Dynamic features -->
          </div>
        </div>

        <!-- Technical Features Component -->
        <div
          class="glass-panel border border-slate-800/60 rounded-3xl p-8 sm:p-10 relative overflow-hidden group/tech"
        >
          <!-- Ambient glow for technical section -->
          <div
            class="absolute -right-20 -top-20 w-64 h-64 bg-indigo-600/10 blur-[60px] rounded-full pointer-events-none transition-all duration-700 group-hover/tech:bg-indigo-500/20"
          ></div>
          <div
            class="absolute -left-20 -bottom-20 w-64 h-64 bg-purple-600/10 blur-[60px] rounded-full pointer-events-none transition-all duration-700 group-hover/tech:bg-purple-500/20"
          ></div>

          <div class="text-center mb-10 relative z-10">
            <div
              class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-800/50 border border-slate-700/50 text-indigo-400 mb-4 shadow-inner"
            >
              <i data-lucide="cpu" class="w-6 h-6"></i>
            </div>
            <h2
              id="tech-features-title"
              class="text-2xl sm:text-3xl font-bold text-white mb-3 tracking-tight"
            ></h2>
            <p
              id="tech-features-subtitle"
              class="text-slate-400 text-sm sm:text-base font-light max-w-2xl mx-auto"
            ></p>
          </div>

          <div
            id="tech-features-grid"
            class="grid grid-cols-1 md:grid-cols-2 gap-5 relative z-10"
          >
            <!-- Dynamic technical features -->
          </div>
        </div>

        <!-- Additional Notes Component (Removed from cards) -->
        <div
          class="glass-panel border border-slate-800/60 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row gap-6 items-start"
        >
          <div
            class="w-12 h-12 rounded-full bg-slate-800/80 border border-slate-700 flex flex-shrink-0 items-center justify-center text-slate-400"
          >
            <i data-lucide="info" class="w-6 h-6"></i>
          </div>
          <div>
            <h3
              id="notes-title"
              class="text-base font-bold text-white mb-3"
            ></h3>
            <ul
              id="notes-list"
              class="space-y-2 text-sm text-slate-400 font-light list-disc list-inside marker:text-slate-600"
            >
              <!-- Dynamic notes -->
            </ul>
          </div>
        </div>
      </div>
    </main>

    <script>
      const plansData = {
        PlansSection: {
          heading: "زیرساخت مناسب فروشگاه خود را انتخاب کنید",
          subHeading:
            "راهکارهای هاستینگ اختصاصی‌سازی‌شده برای رشد و پایداری فروشگاه شما.",
          popularLabel: "محبوب‌ترین",
          commonFeatures: {
            title: "امکانات پایه‌ای مشترک در تمامی سرویس‌های یونیکسی",
            items: [
              { icon: "lock", label: "گواهی SSL معتبر", value: "Google Trust" },
              {
                icon: "activity",
                label: "مانیتورینگ و پایش",
                value: "۷ روز هفته / ۲۴ ساعته",
              },
              {
                icon: "rotate-ccw",
                label: "بکاپ‌گیری منظم",
                value: "دوره‌های روزانه و هفتگی",
              },
              {
                icon: "settings",
                label: "مدیریت سرویس",
                value: "پیکربندی توسط تیم ما",
              },
            ],
          },
          technicalFeatures: {
            title: "زیرساخت فنی، امنیتی و مدیریت حرفه‌ای",
            subtitle:
              "ما تمامی ابزارهای لازم برای اوج عملکرد فروشگاه شما را از پیش فراهم کرده‌ایم.",
            items: [
              {
                icon: "zap",
                title: "Redis Object Cache",
                description:
                  "کاهش چشمگیر زمان پاسخ‌گویی دیتابیس و افزایش سرعت لود صفحات با ذخیره‌سازی بهینه کوئری‌ها. تجربه‌ای روان و بدون تاخیر برای مشتریان شما در زمان جستجو و ثبت سفارش.",
              },
              {
                icon: "rocket",
                title: "وب‌سرور لایت‌اسپید (LiteSpeed)",
                description:
                  "پردازش سریع‌تر درخواست‌ها و مدیریت بهینه ترافیک هم‌زمان با معماری رویدادمحور. تضمین پایداری سایت حتی در پیک‌های ترافیکی و کمپین‌های سنگین فروش.",
              },
              {
                icon: "shield-check",
                title: "فایروال‌های امنیتی (WAF & Anti-DDoS)",
                description:
                  "محافظت پیشرفته و در لحظه از فروشگاه شما در برابر حملات مخرب، ربات‌ها و حملات DDoS. ایجاد سپری امن برای حفظ یکپارچگی داده‌ها و اطلاعات حساس کاربران.",
              },
              {
                icon: "users",
                title: "مدیریت زیرساخت توسط متخصصین",
                description:
                  "تیم مهندسی یونیکسی به صورت ۲۴ ساعته در کنار شماست. از کانفیگ اختصاصی سرور تا پایش لحظه‌ای و رفع گلوگاه‌های پردازشی، همه چیز توسط متخصصین ارشد ما مدیریت می‌شود.",
              },
            ],
          },
          additionalNotes: {
            title: "نکات تکمیلی سرویس‌ها",
            items: [
              "پیکربندی نهایی و هزینه دقیق سرویس‌ها بر اساس موقعیت و ظرفیت موجود، پیش از فعال‌سازی به شما اعلام می‌شود.",
              "در پلن‌های کمپین، فعال‌سازی افزونه‌هایی مانند Campaign Gateway جزو منابع پایه سرور نیست و پس از بررسی شرایط ارائه می‌گردد.",
              "برای سرویس‌های Enterprise، جزئیات دقیق، ساختار بکاپ، مانیتورینگ و معماری پس از یک جلسه بررسی فنی استخراج خواهد شد.",
            ],
          },
          items: {
            core: {
              title: "UNIX CORE",
              badge: "Lite",
              isPopular: false,
              description:
                "برای فروشگاه‌های ووکامرسی که هاست دیگر پاسخ‌گوی ترافیک نیست و به منابع پایدارتر نیاز دارند.",
              features: {
                location: { label: "لوکیشن", value: "ایران / اروپا" },
                ip: { label: "آی‌پی اختصاصی", value: "مشترک" },
                cpu: { label: "پردازنده", value: "AMD / Intel" },
                memory: { label: "رم", value: "۱۶ گیگابایت" },
                suitability: {
                  label: "مناسب برای",
                  value: "دیتابیس زیر ۴ گیگ",
                },
              },
              cta: { label: "دریافت مشاوره", href: "#" },
            },
            scale: {
              title: "UNIX SCALE",
              badge: "سرور اختصاصی مدیریت‌شده",
              isPopular: true,
              description:
                "برای فروشگاه‌های پرترافیک؛ منابع اختصاصی و مدیریت مداوم زیرساخت، ظرفیت بیشتری برای پایداری فراهم می‌کند.",
              features: {
                location: { label: "لوکیشن", value: "ایران / اروپا" },
                ip: { label: "آی‌پی اختصاصی", value: "دارد" },
                cpu: { label: "پردازنده", value: "AMD / Intel" },
                memory: { label: "رم", value: "۳۲ گیگابایت" },
                suitability: {
                  label: "مناسب برای",
                  value: "دیتابیس ۴ الی ۸ گیگ",
                },
              },
              cta: { label: "دریافت مشاوره", href: "#" },
            },
            peak: {
              title: "UNIX PEAK",
              badge: "سرور کمپین مدیریت‌شده",
              isPopular: false,
              description:
                "برای اجرای کمپین‌های فروش پرترافیک، با منابع پردازشی بالا و مانیتورینگ لحظه‌ای برای پایداری سبد خرید.",
              features: {
                location: { label: "موقعیت", value: "ایران / اروپا" },
                ip: { label: "آی‌پی اختصاصی", value: "دارد" },
                cpu: { label: "پردازنده", value: "Intel" },
                memory: { label: "حافظه", value: "۱۲۸ گیگابایت DDR4" },
                suitability: {
                  label: "مناسب برای",
                  value: "سایت‌های پربازدید",
                },
              },
              addOn: {
                label: "OPTIONAL ADD-ON",
                description:
                  "امکان افزودن افزونه Campaign Gateway و Waiting Room به صورت اختیاری.",
              },
              cta: { label: "دریافت مشاوره", href: "#" },
            },
            enterprise: {
              title: "UNIX ENTERPRISE",
              badge: "سرور اختصاصی سفارشی",
              isPopular: false,
              description:
                "برای فروشگاه‌های بزرگ و پرتراکنش که به معماری متناسب و سطح بالاتری از کنترل و پایداری نیاز دارند.",
              features: {
                serviceType: { label: "نوع سرویس", value: "معماری سفارشی" },
                location: { label: "موقعیت", value: "متناسب با نیاز" },
                cpu: { label: "پردازنده", value: "سناریوی فنی" },
                memoryAndStorage: { label: "حافظه", value: "بر اساس حجم داده" },
                security: { label: "معماری", value: "طراحی RPO/RTO" },
              },
              cta: { label: "دریافت مشاوره", href: "#" },
            },
          },
        },
      };

      document.addEventListener("DOMContentLoaded", () => {
        const section = plansData.PlansSection;

        // Set Page Texts
        document.getElementById("section-heading").innerText = section.heading;
        document.getElementById("section-subheading").innerText =
          section.subHeading;
        document.getElementById("common-features-title").innerText =
          section.commonFeatures.title;

        // If using the inline JSON in HTML, make sure to add technicalFeatures to it as well!
        // Here we assume it exists in `section.technicalFeatures` based on the JSON update.
        if (section.technicalFeatures) {
          document.getElementById("tech-features-title").innerText =
            section.technicalFeatures.title;
          document.getElementById("tech-features-subtitle").innerText =
            section.technicalFeatures.subtitle;
        }

        document.getElementById("notes-title").innerText =
          section.additionalNotes.title;

        const getFeatureIcon = (key) => {
          const icons = {
            location: "globe",
            ip: "shield-check",
            cpu: "cpu",
            memory: "hard-drive",
            memoryAndStorage: "database",
            suitability: "check-circle-2",
            security: "shield-alert",
            serviceType: "layers",
          };
          return icons[key] || "check";
        };

        // Render Cards
        const container = document.getElementById("plans-container");
        Object.entries(section.items).forEach(([key, plan]) => {
          const isPopular = plan.isPopular;

          // Structure Fixed: Flex-col in Header prevents overflow entirely
          const cardHTML = `
          <div class="tilt-card group relative flex flex-col h-full rounded-2xl border p-6 ${
            isPopular
              ? "glass-popular border-indigo-500/60 ring-1 ring-indigo-500/30 glow-effect hover:shadow-[0_0_50px_-10px_rgba(99,102,241,0.4)]"
              : "glass-card border-slate-800 hover:border-slate-600 hover:shadow-2xl hover:shadow-indigo-500/10"
          }">
            
            ${
              isPopular
                ? `
              <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 bg-gradient-to-r from-indigo-500 to-purple-600 text-white text-[11px] font-bold px-4 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 border border-indigo-400/30">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>${section.popularLabel}</span>
              </div>
            `
                : ""
            }

            <!-- Header Fixed: Stacked to avoid overflow -->
            <div class="mb-5 flex flex-col items-start gap-3">
              <span class="inline-block text-[11px] font-semibold px-2.5 py-1 rounded-md ${
                isPopular
                  ? "bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"
                  : "bg-slate-800 text-slate-300 border border-slate-700"
              }">${plan.badge}</span>
              
              <h3 class="text-xl sm:text-2xl font-extrabold text-white tracking-wide break-words w-full uppercase">
                ${plan.title}
              </h3>
            </div>

            <p class="text-[13px] text-slate-400 leading-relaxed mb-6 font-light">
              ${plan.description}
            </p>

            <!-- Features List -->
            <div class="space-y-3.5 pt-5 border-t border-slate-800/80 mb-6 flex-grow">
              ${Object.entries(plan.features)
                .map(
                  ([featKey, featVal]) => `
                <div class="flex items-center gap-3 text-[13px]">
                  <div class="p-1.5 rounded-md ${isPopular ? "bg-indigo-500/20 text-indigo-400" : "bg-slate-800 text-slate-400"} shrink-0">
                    <i data-lucide="${getFeatureIcon(featKey)}" class="w-4 h-4"></i>
                  </div>
                  <div class="flex-1 flex justify-between items-center border-b border-slate-800/40 pb-1 border-dashed">
                    <span class="text-slate-400">${featVal.label}</span>
                    <span class="text-slate-200 font-medium pl-1 text-left">${featVal.value}</span>
                  </div>
                </div>
              `,
                )
                .join("")}
              
                ${
                  plan.addOn
                    ? `
                <div class="mt-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-xs">
                  <div class="flex items-center gap-1.5 text-amber-400 font-bold mb-1.5">
                    <i data-lucide="zap" class="w-3.5 h-3.5"></i>
                    <span>${plan.addOn.label}</span>
                  </div>
                  <p class="text-slate-300/90 text-[11px] leading-relaxed font-light">${plan.addOn.description}</p>
                </div>
              `
                    : ""
                }
            </div>

            <!-- CTA Button Minimal immediately after features -->
            <div class="mt-auto pt-2">
              <a href="${plan.cta.href}" class="group/btn w-full inline-flex items-center justify-center gap-2 font-bold text-sm py-3.5 px-4 rounded-xl transition-all duration-300 ${
                isPopular
                  ? "bg-indigo-600 hover:bg-indigo-500 text-white shadow-[0_0_20px_rgba(79,70,229,0.25)] hover:shadow-[0_0_25px_rgba(79,70,229,0.4)] active:scale-[0.98]"
                  : "bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 active:scale-[0.98]"
              }">
                <span>${plan.cta.label}</span>
                <i data-lucide="arrow-left" class="w-4 h-4 transition-transform duration-300 group-hover/btn:-translate-x-1.5"></i>
              </a>
            </div>

          </div>
        `;
          container.insertAdjacentHTML("beforeend", cardHTML);
        });

        const featuresContainer = document.getElementById(
          "common-features-grid",
        );
        section.commonFeatures.items.forEach((item) => {
          featuresContainer.insertAdjacentHTML(
            "beforeend",
            `
          <div class="flex items-center gap-4 bg-slate-900/40 p-4 rounded-2xl border border-slate-800/50">
            <div class="p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 shrink-0">
              <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            </div>
            <div>
              <h4 class="text-slate-200 font-semibold text-sm mb-0.5">${item.label}</h4>
              <p class="text-slate-400 text-xs">${item.value}</p>
            </div>
          </div>
        `,
          );
        });

        if (section.technicalFeatures) {
          const techFeaturesContainer =
            document.getElementById("tech-features-grid");
          section.technicalFeatures.items.forEach((item) => {
            techFeaturesContainer.insertAdjacentHTML(
              "beforeend",
              `
            <div class="flex items-start gap-4 p-5 rounded-2xl bg-slate-900/40 border border-slate-800/60 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-300 group">
              <div class="p-3 rounded-xl bg-slate-800/80 border border-slate-700/50 text-indigo-400 group-hover:text-indigo-300 group-hover:bg-indigo-500/10 group-hover:border-indigo-500/30 group-hover:shadow-[0_0_20px_rgba(99,102,241,0.15)] transition-all duration-300 shrink-0 mt-0.5 relative overflow-hidden">
                <i data-lucide="${item.icon}" class="w-6 h-6 relative z-10"></i>
              </div>
              <div>
                <h4 class="text-slate-200 font-bold text-base mb-2 tracking-wide">${item.title}</h4>
                <p class="text-slate-400 text-[13px] leading-relaxed font-light">${item.description}</p>
              </div>
            </div>
          `,
            );
          });
        }

        const notesContainer = document.getElementById("notes-list");
        section.additionalNotes.items.forEach((note) => {
          notesContainer.insertAdjacentHTML("beforeend", `<li>${note}</li>`);
        });

        lucide.createIcons();

        // 3D Hover Tilt Effect Logic
        const tiltCards = document.querySelectorAll(".tilt-card");
        tiltCards.forEach((card) => {
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Calculate rotation limits (max 5 degrees for subtlety)
            const rotateX = ((y - centerY) / centerY) * -5;
            const rotateY = ((x - centerX) / centerX) * 5;

            // Apply 3D transform with slight scale up
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
          });

          card.addEventListener("mouseleave", () => {
            // Reset smoothly on mouse leave
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
          });
        });
      });
    </script>
  </body>
</html>
